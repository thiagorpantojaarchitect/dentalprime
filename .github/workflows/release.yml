# Release: build e push das imagens de container para o ECR + cdk diff.
#
# Acionado MANUALMENTE (workflow_dispatch). NAO faz deploy: publica as imagens
# na tag do commit e mostra o `cdk diff` do ambiente escolhido, para revisao e
# aprovacao humana antes de qualquer `cdk deploy`.
#
# Autenticacao na AWS por OIDC (sem chaves estaticas). Requer:
#   - Variavel de repositorio AWS_ACCOUNT_ID
#   - Uma IAM Role com trust para o OIDC do GitHub e permissao de push no ECR
#     e leitura para `cdk diff` (nome em vars.AWS_OIDC_ROLE ou o padrao abaixo).
#
# Autenticar aqui NAO concede permissao de deploy: o deploy usa um fluxo
# separado, com aprovacao explicita.

name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo do cdk diff
        type: choice
        options: [development, staging, production]
        default: development

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # necessario para OIDC com a AWS

env:
  AWS_REGION: sa-east-1

jobs:
  build-push:
    name: build e push das imagens (ECR)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity-access, port: 3001 }
          - { name: patient-record, port: 3002 }
          - { name: smart-scheduling, port: 3003 }
          - { name: treatment-plan, port: 3004 }
          - { name: finance, port: 3005 }
          - { name: crm-growth, port: 3006 }
          - { name: ai-front-desk, port: 3007 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE || format('arn:aws:iam::{0}:role/dentalprime-ci-ecr', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service.name }}
            PORT=${{ matrix.service.port }}
          tags: ${{ steps.ecr.outputs.registry }}/dentalprime/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  cdk-diff:
    name: cdk diff (${{ inputs.environment }})
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE || format('arn:aws:iam::{0}:role/dentalprime-ci-ecr', vars.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      # Mostra o diff da infraestrutura com a tag de imagem deste commit.
      # NAO faz deploy: a implantacao e um passo manual, aprovado a parte.
      - name: cdk diff
        working-directory: infrastructure
        run: npx cdk diff -c env=${{ inputs.environment }} -c imageTag=${{ github.sha }}
